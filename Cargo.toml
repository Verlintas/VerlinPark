[workspace]
resolver = "2"
members = [
    "crates/vp-protocol",
    "crates/vp-store",
    "crates/vp-providers",
    "crates/vp-core",
    "crates/vp-daemon",
    "crates/vp-cli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Verlintas/VerlinPark"
authors = ["Verlintas"]

[workspace.dependencies]
anyhow = "1"
async-recursion = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
eventsource-stream = "0.2"
globset = "0.4"
fs2 = "0.4"
futures-util = "0.3"
ignore = "0.4"
libc = "0.2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
