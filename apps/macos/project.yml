name: VerlinPark
options:
  bundleIdPrefix: com.verlintas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: NO
    DEVELOPMENT_TEAM: ""
    CLANG_ENABLE_MODULES: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.1

targets:
  VerlinPark:
    type: application
    platform: macOS
    sources:
      - path: VerlinPark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verlintas.VerlinPark
        PRODUCT_NAME: VerlinPark
        INFOPLIST_FILE: VerlinPark/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: SwiftTerm
  VerlinParkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VerlinParkTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verlintas.VerlinParkTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VerlinPark
  VerlinParkBrowserHelper:
    type: tool
    platform: macOS
    sources:
      - path: VerlinParkBrowserHelper
    settings:
      base:
        PRODUCT_NAME: VerlinParkBrowserHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.verlintas.VerlinParkBrowserHelper
        GENERATE_INFOPLIST_FILE: YES
  VerlinParkComputerHelper:
    type: tool
    platform: macOS
    sources:
      - path: VerlinParkComputerHelper
      - path: VerlinParkComputerHelperCore
    settings:
      base:
        PRODUCT_NAME: VerlinParkComputerHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.verlintas.VerlinParkComputerHelper
        GENERATE_INFOPLIST_FILE: YES
  VerlinParkComputerHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VerlinParkComputerHelperCore
      - path: VerlinParkComputerHelperTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verlintas.VerlinParkComputerHelperTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VerlinPark:
    build:
      targets:
        VerlinPark: all
        VerlinParkBrowserHelper: all
        VerlinParkComputerHelper: all
    test:
      targets:
        - VerlinParkTests
        - VerlinParkComputerHelperTests
